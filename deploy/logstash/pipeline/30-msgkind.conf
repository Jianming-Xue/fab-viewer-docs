# ==============================================================================
# 第 3 段：打消息类型标签（MSG_KIND）—— 口径见 docs/04-后台链路与数据模型.md §3.2.3
#
# ⚠ 本文件由 tools/render_msgkinds.py 从 fabviewer.yaml 的第 1 段**自动生成**，
#   不要手改。改规则请改 fabviewer.yaml，然后重跑：
#       python3 tools/render_msgkinds.py
#   Logstash 开了 config.reload.automatic（3s），生成后自动重载。
#
# 语义：按 yaml 里的顺序，**第一条命中的规则生效**（第一个命中即停）—— 对应 04 §3.2.3
#   「每行只打一个标签」。命中的同时把 capture / set 的值写进行级字段
#   （CALL_SYS / LOCK_OBJ / LOCK_ID / ERR_CODE / RULE_RESULT）。
#   全都不命中 → MSG_KIND = OTHER。
#
# 生成时间：2026-09-23 16:02:17
# 规则条数：15
# ==============================================================================

filter {
  if [dir_flag] == "::R::" {
    mutate { replace => { "MSG_KIND" => "COMM_R" } }
  }

  else if [dir_flag] == "::S::" {
    mutate { replace => { "MSG_KIND" => "COMM_S" } }
  }

  else if [dir_flag] == "::P::" {
    mutate { replace => { "MSG_KIND" => "COMM_P" } }
  }

  else if [LOG_BODY] =~ /FwEventManager:message to process: :>>[LT]/ {
    mutate { replace => { "MSG_KIND" => "REQ_BEGIN" } }
  }

  else if [server_id] =~ /^DTPFsrv$/ and [LOG_BODY] =~ /Command mailbox name:/ {
    mutate { replace => { "MSG_KIND" => "SERVER_START" } }
  }

  else if [LOG_BODY] =~ /IntUtil::sendMessage:### xmlData for sending to (\S+)/ {
    grok {
      match => { "LOG_BODY" => "IntUtil::sendMessage:### xmlData for sending to (?<CALL_SYS>\\S+)" }
      tag_on_failure => []
    }
    mutate { replace => { "MSG_KIND" => "CALL_REQ" } }
  }

  else if [LOG_BODY] =~ /IntUtil::sendMessage:### Received Message from (\S+)/ {
    grok {
      match => { "LOG_BODY" => "IntUtil::sendMessage:### Received Message from (?<CALL_SYS>\\S+)" }
      tag_on_failure => []
    }
    mutate { replace => { "MSG_KIND" => "CALL_RSP" } }
  }

  else if [LOG_BODY] =~ /FabApfUtilImpl::callRtdDispatchRule:RTD: Return Format is:/ {
    mutate { add_field => { "CALL_SYS" => "RTD" } }
    mutate { replace => { "MSG_KIND" => "CALL_REQ" } }
  }

  else if [LOG_BODY] =~ /FabApfUtilImpl::callRtdDispatchRule:RTD: Success\.\.\.!No Error/ {
    mutate { add_field => { "CALL_SYS" => "RTD" } }
    mutate { replace => { "MSG_KIND" => "CALL_RSP" } }
  }

  else if [LOG_BODY] =~ /DTPFSSRSupport::dtpfExecuteServerSideRule:Input attributes before executing rule: _sendEdcSpaceData/ {
    mutate { add_field => { "CALL_SYS" => "SPC" } }
    mutate { replace => { "MSG_KIND" => "CALL_REQ" } }
  }

  else if [LOG_BODY] =~ /DTPFSSRSupport::dtpfExecuteServerSideRule:Output attributes before executing rule: _sendEdcSpaceData/ {
    mutate { add_field => { "CALL_SYS" => "SPC" } }
    mutate { replace => { "MSG_KIND" => "CALL_RSP" } }
  }

  else if [LOG_BODY] =~ /\bLOCK (?<OBJ>\w+) OBJECT START(?:\s+\w+:(?<ID>\S+))?/ {
    grok {
      match => { "LOG_BODY" => "\\bLOCK (?<OBJ>\\w+) OBJECT START(?:\\s+\\w+:(?<ID>\\S+))?" }
      tag_on_failure => []
    }
    mutate { replace => { "MSG_KIND" => "LOCK_BEGIN" } }
  }

  else if [LOG_BODY] =~ /\bLOCK (?<OBJ>\w+) OBJECT END(?:\s+\w+:(?<ID>\S+))?/ {
    grok {
      match => { "LOG_BODY" => "\\bLOCK (?<OBJ>\\w+) OBJECT END(?:\\s+\\w+:(?<ID>\\S+))?" }
      tag_on_failure => []
    }
    mutate { replace => { "MSG_KIND" => "LOCK_END" } }
  }

  else if [LOG_BODY] =~ /Error\(([^)]+)\)/ {
    ruby { code => "event.set('ERR_CODE', event.get('LOG_BODY').to_s.scan(/Error\\(([^)]+)\\)/).flatten)" }
    mutate { replace => { "MSG_KIND" => "RULE_ERR_LINE" } }
  }

  else if [LOG_BODY] =~ /FwSrvExecuteRuleTxn::store:rule reply =\s*(\S+)\s*$/ {
    grok {
      match => { "LOG_BODY" => "FwSrvExecuteRuleTxn::store:rule reply =\\s*(?<RULE_RESULT>\\S+)\\s*$" }
      tag_on_failure => []
    }
    mutate { replace => { "MSG_KIND" => "RULE_REPLY" } }
  }
  else {
    # 以上都不是（04 §3.2.3 标签表的默认值）
    mutate { replace => { "MSG_KIND" => "OTHER" } }
  }
}
