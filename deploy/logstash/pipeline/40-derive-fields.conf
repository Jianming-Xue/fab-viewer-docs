# ==============================================================================
# 第 4 段：派生字段、行键、字段裁剪（04 §3.2.1 第二道、§3.2.2、§3.3）
#
# 顺序不能换：
#   ① 采集层字段归位         → LOG_FILE / LOG_INODE / LOG_OFFSET
#   ② 时间                  → LOG_TIME（yyyy/MM/dd HH:mm:ss.SSS）+ SORT_KEY（16 位厘秒串）
#   ③ SERVER_ID             → 行首 token；框架行用 mailbox name 修正；通信族取文件名
#   ④ 类别与编号            → SERVER_CATEGORY / SERVER_NUMBER（从最终的 SERVER_ID 反推）
#   ⑤ HOSTIP                → 按 CIDR 从 host.ip 数组里选
#   ⑥ 行身份 + 索引名        → LOG_LINE_ID；[@metadata][index]
#   ⑦ 字段白名单裁剪         → 只留索引模板里有的字段（dynamic: strict，多一个就写入失败）
# ==============================================================================

filter {
  # ---------- ① 采集层字段归位 ----------
  ruby {
    code => "
      p = event.get('[log][file][path]')
      event.set('LOG_FILE', p.split('/').last) if p
      inode = event.get('[log][file][inode]')
      event.set('LOG_INODE', inode.to_i) if inode
      off = event.get('[log][offset]')
      event.set('LOG_OFFSET', off.to_i) if off
    "
  }

  # ---------- ② 时间 ----------
  # 业务族 MM/dd/yy HH:mm:ss.cc：两位年份按 70 分界补全（04 §3.2.1 坑 2），
  #   厘秒补齐成三位毫秒（坑 5），时区显式 +08:00（坑 3）
  # 通信族 yyyy/MM/dd HH:mm:ss.SSS：已是三位毫秒，SORT_KEY 截到厘秒（前两位）
  # 纯文本行：LOG_TIME 取采集时刻 @timestamp 归一，SORT_KEY 从它造（04 §3.2.2「纯文本行兜底」）
  ruby {
    init => "require 'time'"
    code => "
      t = nil
      if event.get('log_date') && event.get('log_time')
        begin
          md = event.get('log_date').split('/')
          tm = event.get('log_time').split(':')
          yy = md[2].to_i
          year = yy >= 70 ? 1900 + yy : 2000 + yy
          t = Time.new(year, md[0].to_i, md[1].to_i, tm[0].to_i, tm[1].to_i, tm[2].to_i, '+08:00')
          cs = event.get('log_cs').to_s.rjust(2, '0')[0, 2]
          ms = (cs.to_i * 10).to_s.rjust(3, '0')
          event.set('LOG_TIME', t.strftime('%Y/%m/%d %H:%M:%S') + '.' + ms)
          event.set('SORT_KEY', t.strftime('%Y%m%d%H%M%S') + cs)
        rescue
          t = nil
        end
      elsif event.get('log_time')
        begin
          raw = event.get('log_time').to_s
          t = Time.parse(raw + '+08:00')
          ms = raw.split('.')[1].to_s.rjust(3, '0')[0, 3]
          event.set('LOG_TIME', t.strftime('%Y/%m/%d %H:%M:%S') + '.' + ms)
          event.set('SORT_KEY', t.strftime('%Y%m%d%H%M%S') + ms[0, 2])
        rescue
          t = nil
        end
      end
      unless t
        lt = event.get('@timestamp').time.getlocal('+08:00')
        msec = lt.usec / 1000
        event.set('LOG_TIME', lt.strftime('%Y/%m/%d %H:%M:%S') + '.' + msec.to_s.rjust(3, '0'))
        event.set('SORT_KEY', lt.strftime('%Y%m%d%H%M%S') + (msec / 10).to_s.rjust(2, '0'))
      end
    "
  }

  # ---------- ③④ SERVER_ID 与它的两个派生字段 ----------
  # ③ 三个来源，按优先级：
  #    a. 框架行（行首 DTPFsrv）：行内含 Command mailbox name: → 取其后的第一个 token 覆盖；
  #       **取不到就留空**，不退回框架名 —— 带框架名进去会自成一条假流（04 §3.2.1.3）
  #    b. 行首 token（业务族绝大多数行走这条）
  #    c. 通信族文件名（COMM_RCVsrv.1.0920.12-18.log.0 → COMM_RCVsrv.1）
  # ④ 一律从**最终值**反推：srv 之前整段 → SERVER_CATEGORY，最后一个 . 后的数字 → SERVER_NUMBER
  #    推不出就留空，不写占位（04 §3.2.1.3）
  ruby {
    code => "
      sid = event.get('server_id')
      if sid == 'DTPFsrv'
        sid = event.get('LOG_RAW').to_s[/Command mailbox name:\s*(\S+)/, 1]
      end
      if sid.nil? || sid.empty?
        fname = event.get('[@metadata][fname]').to_s
        sid = fname[/^([^.]*srv\.\d+)\./, 1]
      end
      if sid && !sid.empty?
        event.set('SERVER_ID', sid)
        m = /^(.+?)srv(?:\.(\d+))?$/.match(sid)
        if m
          event.set('SERVER_CATEGORY', m[1])
          event.set('SERVER_NUMBER', m[2]) if m[2]
        end
      end
    "
  }

  # ---------- ⑤ HOSTIP ----------
  # 采集层带全部网卡地址（多值），这里按 CIDR 取内网那一个（04 §2.1、§2.3）
  # 网段按现场改下面这一行；取不到就留空 —— 空的 HOSTIP 会让该行进不了流，由守门哨计数
  ruby {
    init => "require 'ipaddr'"
    code => "
      cidrs = ['10.0.0.0/8']
      ips = event.get('host.ip')
      ips = [ips] if ips.is_a?(String)
      pick = nil
      (ips || []).each do |ip|
        begin
          addr = IPAddr.new(ip)
          pick = ip if cidrs.any? { |c| IPAddr.new(c).include?(addr) }
        rescue
        end
        break if pick
      end
      event.set('HOSTIP', pick) if pick
    "
  }

  # ---------- ⑥ 行身份键 + 当天索引名 ----------
  # LOG_LINE_ID = ENV _ HOSTIP _ LOG_INODE _ LOG_OFFSET _ SORT_KEY，**段间用下划线**（04 §3.2.2）：
  #   五段值域都不含下划线（字母 / 点分数字 / 数字 / 数字 / 数字），拼出来可唯一还原；
  #   末段带 SORT_KEY 是为挡 inode 复用：文件删掉后 inode 会被新文件拿走，而每个文件的
  #   第一行偏移都是 0 —— 不带时间，两代文件的首行会撞成同一个 _id（静默覆盖丢行）。
  #   纯文本行的 SORT_KEY 取自 @timestamp，重投时会变，这类行不保证幂等（已知例外）。
  #   它只作 _id 与 term 比较，不需要人读
  # 索引名取 LOG_TIME 的日期而不是摄入时间：回采历史滚动件时，老行落回它自己那一天
  #   （04 §5.2.1；索引名里的 env 必须小写，字段值 ENV 仍是大写）
  ruby {
    code => "
      parts = [event.get('ENV'), event.get('HOSTIP'), event.get('LOG_INODE'), event.get('LOG_OFFSET'),
               event.get('SORT_KEY')]
      if parts.all? { |x| x }
        event.set('LOG_LINE_ID', parts.map { |x| x.to_s }.join('_'))
      end
      d = event.get('LOG_TIME').to_s[0, 10].tr('/', '.')
      idx = 'mes-log-line-' + event.get('ENV').to_s.downcase + '-' + d
      event.set('[@metadata][index]', idx)
    "
  }

  # ---------- ⑦ 字段白名单 ----------
  # 行索引模板是 dynamic: strict：多出一个字段整篇写入失败。
  # 所以这里按模板字段表（deploy/opensearch/11-template-line.json）做一次裁剪，
  # 把 Filebeat / Logstash 的元字段（host / agent / ecs / log / input / event / tags …）
  # 与中间字段（log_date / log_time / log_cs / server_id / proc_info / dir_flag）全部清掉。
  # 与模板对不上时改这里，不要放宽 dynamic
  ruby {
    code => "
      keep = %w[@timestamp LOG_LINE_ID SORT_KEY system.name ENV HOSTIP SERVER_ID
                SERVER_CATEGORY SERVER_NUMBER LOG_TIME LOG_FILE LOG_INODE LOG_OFFSET
                LOG_RAW LOG_BODY MSG_KIND CALL_SYS LOCK_OBJ LOCK_ID ERR_CODE RULE_RESULT
                INNER_RULE_NAME]
      (event.to_hash.keys - keep).each { |k| event.remove(k) }
    "
  }
}
