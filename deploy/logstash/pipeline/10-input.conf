# ==============================================================================
# 第 1 段：输入（加工层入口）
#
# 上游是采集层的 Filebeat（deploy/filebeat/filebeat.yml 的 output.logstash）。
# 采集层送过来的事件已经带齐 7 个字段（04 §2.3）：
#   message / log.file.path / log.file.fingerprint / log.offset / host.ip / ENV / system.name
# 其中 ENV 与 system.name 是采集配置里的常量、落在顶层（fields_under_root: true）
# ==============================================================================

input {
  beats {
    port => 5044
    # Filebeat 侧已开压缩（compression_level: 3），这里不用另设
    # 采集层多实例 + loadbalance 时会并发投递，日志顺序由派生层按二级重排还原（04 §5.2.4），
    # 所以这里不需要保序
  }
}
