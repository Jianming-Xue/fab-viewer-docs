# ==============================================================================
# 第 2 段：粗解析行前缀（04 §3.2.1 第一道）
#
# 产出：时间段（log_date / log_time / log_cs）、行首 token（server_id）、正文（LOG_BODY）
# 分流：两套前缀按**文件来源**选，不试错匹配（04 §3.2.1）
#   通信族文件名 ^COMM_(RCV|SND)srv  → COMM_LINE
#   其余（业务族 + POLL）            → MES_RULE_LINE
#
# 本段产出的中间字段（log_date / log_time / log_cs / server_id / proc_info / dir_flag）
# 在 30、40 两段被消费，最后被 40 段末的字段白名单清掉 —— 不落进文档
# ==============================================================================

filter {
  # 文件名（取 basename）：既用来分流两套前缀，也是通信族 SERVER_ID 的唯一来源
  ruby {
    code => "
      p = event.get('[log][file][path]')
      event.set('[@metadata][fname]', p ? p.split('/').last : '')
    "
  }

  if [@metadata][fname] =~ /^COMM_(RCV|SND)srv/ {
    grok {
      patterns_dir => ["/etc/logstash/patterns"]
      match => { "message" => "%{COMM_LINE}" }
      tag_on_failure => ["_mes_plain_line"]     # 行首也不是时间戳 → 按纯文本行处置
    }
  } else {
    grok {
      patterns_dir => ["/etc/logstash/patterns"]
      match => { "message" => "%{MES_RULE_LINE}" }
      tag_on_failure => ["_mes_plain_line"]
    }
  }

  # 原文一字不改地留一份；LOG_BODY 是去掉行首前缀的本体（04 §3.3）
  mutate {
    rename => { "message" => "LOG_RAW" }
  }

  # 纯文本行（业务方确认为正常输出，不是畸形数据）：不解析，但正文照旧可检索（04 §3.2.1 末）
  if [log_body] {
    mutate { rename => { "log_body" => "LOG_BODY" } }
  } else {
    mutate { add_field => { "LOG_BODY" => "%{LOG_RAW}" } }
  }
}
