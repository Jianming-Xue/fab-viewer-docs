# ==============================================================================
# 第 1.5 段：守门哨（管道级兜底）
#
# 主隔离是专用端口（10-input 的 beats 绑 MES 专用口，多管道物理分道）；
# 本哨只防「配错」—— 新机器 Filebeat 误指向、现场改口失误把别的事件打进本管道。
# 判据用采集层注入的常量 system.name：非 MES 事件直接丢弃，不进解析、不落库。
# 计数归自监控（部署时按现场手段接 node stats / metrics，本期只保证丢弃）。
# ==============================================================================

filter {
  # 判据是嵌套字段，必须写 [system][name]：Logstash 9.x 的字段引用不把括号内的点号
  # 当嵌套分隔（[system.name] 查的是字面顶层字段 "system.name"；8.x 的
  # config.field_reference.parsed_dot_separator 开关已移除），原写法取值恒 nil，
  # drop 会把全部事件静默丢弃（filtered 涨、out 恒 0、无任何报错）
  if [system][name] != "MES-300Works" {
    drop { }
  }
}
