# ==============================================================================
# 第 1.5 段：守门哨（管道级兜底，2026-10-13 加）
#
# 主隔离是专用端口（10-input 的 beats 绑 MES 专用口，多管道物理分道，04 §3.4）；
# 本哨只防「配错」—— 新机器 Filebeat 误指向、现场改口失误把别的事件打进本管道。
# 判据用采集层注入的常量 system.name（04 §2.3）：非 MES 事件直接丢弃，不进解析、不落库。
# 计数归自监控（部署时按现场手段接 node stats / metrics，本期只保证丢弃 —— 04 哨子同款口径）。
# ==============================================================================

filter {
  if [system.name] != "MES-300Works" {
    drop { }
  }
}
