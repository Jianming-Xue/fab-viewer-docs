# ==============================================================================
# 第 5 段：输出（写行文档）
#
# 目标索引：dev-mes-log-line-{yyyy.MM.dd}，前缀 dev- 由 40 段的 prefix 常量给出，由 40 段算进 [@metadata][index]
#   日期取 LOG_TIME 的日期（不是摄入时间）—— 回采历史件时落回它自己那一天
#   索引名不带环境段：环境由 prefix 区分（每个环境一套），字段值 ENV 仍是大写、不进索引名
# 文档 _id：行身份串（[@metadata][line_id]，40 拼好；metadata 不落文档）。行文档写一次、此后不再修改，所以 action = index，
#   同一行重复投递（Filebeat 重投、Logstash 重放）覆盖成同一篇，天然幂等
#
# 依赖插件 logstash-output-opensearch —— 必须 2.x 系列（1.x 不支持 Logstash 8+）：
#   bin/logstash-plugin install logstash-output-opensearch   # 装完 list --verbose 核版本
#   或者直接用 OpenSearch 官方打包的 logstash-9.x-with-output-opensearch，省掉这步
#
# 两个必须做对的点（Logstash 9.x）：
#   1) ECS 兼容口径由本段声明（ecs_compatibility => disabled）：行索引模板
#      dynamic: strict，开着 ECS 会补元字段、整篇写入失败；pipelines.yml 不再写这项。
#   2) 不要设 override_main_response_version —— 那是通用 ES 插件的兼容开关，
#      本插件原生认 OpenSearch，设了反而误导。
# ==============================================================================

output {
  opensearch {
    hosts => ["https://os-node-01:9200", "https://os-node-02:9200", "https://os-node-03:9200"]
    user => "fvdev"
    password => "fvdev"
    ssl => true
    ssl_certificate_verification => false
    # 仓库默认关证书校验（插件自带默认是 true）：厂区自签 / 内网证书不用装 CA 就能连通。
    # 现场要强校验，把上面改回 true 并启用下面这行，指向签发 CA；公有 CA 可不带 cacert。
    # 需要强校验时启用：cacert => "/etc/logstash/conf.d/mes-conf/certs/root-ca.pem"

    index => "%{[@metadata][index]}"
    document_id => "%{[@metadata][line_id]}"
    action => "index"

    # 索引模板由部署侧统一装入，不让 Logstash 自己管模板
    manage_template => false

    # 批量行为走插件默认：flush_size / idle_flush_time 是 elasticsearch 输出插件的参数，
    # logstash-output-opensearch 2.x 不认，写上会 Unknown setting、logstash -t 直接拒
    retry_on_conflict => 3

    # ECS 兼容口径落在 50 段（原 pipelines.yml 的 mes-lines 节点）
    ecs_compatibility => disabled
  }
}
