# ==============================================================================
# 第 5 段：输出（写行文档）
#
# 目标索引：mes-log-line-{env}-{yyyy.MM.dd}，由 40 段算进 [@metadata][index]
#   日期取 LOG_TIME 的日期（不是摄入时间）—— 回采历史件时落回它自己那一天
#   env 小写（索引名不允许大写）；字段值 ENV 仍是大写
# 文档 _id：LOG_LINE_ID。行文档写一次、此后不再修改，所以 action = index，
#   同一行重复投递（Filebeat 重投、Logstash 重放）覆盖成同一篇，天然幂等
#
# 依赖插件 logstash-output-opensearch —— 必须 2.x 系列（1.x 不支持 Logstash 8+）：
#   bin/logstash-plugin install logstash-output-opensearch   # 装完 list --verbose 核版本
#   或者直接用 OpenSearch 官方打包的 logstash-9.x-with-output-opensearch，省掉这步
#
# 两个必须做对的点（Logstash 9.x）：
#   1) pipeline.ecs_compatibility 必须是 disabled，且只能写在 logstash.yml /
#      pipelines.yml 里 —— 本插件没有这个参数，写进 output 块会直接配置报错。
#   2) 不要设 override_main_response_version —— 那是通用 ES 插件的兼容开关，
#      本插件原生认 OpenSearch，设了反而误导。
# ==============================================================================

output {
  opensearch {
    hosts => ["https://os-node-01:9200", "https://os-node-02:9200", "https://os-node-03:9200"]
    user => "${OS_USER}"
    password => "${OS_PASSWORD}"
    ssl => true
    ssl_certificate_verification => true
    # 开校验就必须能验到签发者：现场自签证书时把 CA 放这个路径并带上这一行，
    # 缺了会报证书校验失败（看着像网络不通）。用公有 CA 签发的证书则不需要。
    # cacert => "/etc/logstash-mes/certs/root-ca.pem"

    index => "%{[@metadata][index]}"
    document_id => "%{LOG_LINE_ID}"
    action => "index"

    # 索引模板由 deploy/opensearch/apply.sh 统一部署，不让 Logstash 自己管模板
    manage_template => false

    flush_size => 2000
    idle_flush_time => 5
    # action=index 下这个参数不起作用（无版本控制，不会出 409）；
    # 若启动报 Unknown setting，删掉这一行即可。
    retry_on_conflict => 3
  }
}
