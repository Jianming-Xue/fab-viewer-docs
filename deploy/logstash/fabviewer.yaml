# ==============================================================================
# fabviewer.yaml —— 加工层与派生层共用的外置配置（口径源：docs/06-派生服务工程实现.md §四）
#
# 消费方：
#   第 1 段 msg_kinds  → 加工层（Logstash）。由 tools/render_msgkinds.py 渲染成
#                        pipeline/30-msgkind.conf，**不直接读这个文件**
#   第 2 段 cost_items  → 派生层
#   第 3 段 biz_fields  → 派生层
#   第 4 段 derive      → 派生层调度参数
#   第 5 段 worker_health / 第 6 段 alert → 派生层节点健康与告警出口
#
# 改规则的正确姿势：改本文件 → 重跑 tools/render_msgkinds.py → Logstash 自动重载
#   （logstash.yml 里 config.reload.automatic: true，检测周期 3s）
# 加工层加一条标签规则 = 本文件加一条 + 重跑渲染，**不改代码、不重启进程**
# ==============================================================================
version: 2026-09-21

# 第 1 段：加工层消费。行文本特征 → MSG_KIND（04 §3.2.3）
# 注意：不切块的流（COMM_RCV / COMM_SND / POLL）不加**任何切块用**的标签 ——
#       派生层在「找活跃流」那一步就按 SERVER_CATEGORY 剔掉它们了（04 §4.2.1）。
#       唯一例外是通信族的三个方向标记 COMM_R / COMM_S / COMM_P：它们只描述行首方向、
#       不参与切块（04 §3.2.3）
#
# 字段含义：
#   kind      标签名，写进行文档的 MSG_KIND
#   flag      可选。匹配**通信族行首的方向标记**（粗解析切出的 dir_flag，取值 ::R:: / ::S:: / ::P::），
#             相等比较。与 prefix / regex 是「与」的关系
#   prefix    可选。匹配**行首 token**（Logstash grok 出的 server_id），不是 LOG_BODY。
#             与 regex 是「与」的关系，两个都命中才算
#   regex     匹配 LOG_BODY
#   capture   取捕获组落字段：写字符串取第 1 个捕获组；写映射按命名捕获组对应。
#             字段是开放集合 ⇒ 新取值零配置（04 §3.2.3）
#   set       没有捕获组可取的锚点，直接写常量
#   match_all 一行可多个匹配，全部收进同一字段（多值）
msg_kinds:
  # 通信族方向标记（04 §3.2.3）。行首第三段是封闭枚举 ⇒ 直接做标签、
#   取值不进字段。匹配的是粗解析切出来的 dir_flag（判完即弃，不落文档）。
#   放最前 ⇒ 通信行的正文里即使含 Error(...)，也不会被 RULE_ERR_LINE 抢走。
  - kind: COMM_R
    flag: '::R::'
  - kind: COMM_S
    flag: '::S::'
  - kind: COMM_P
    flag: '::P::'
  - kind: REQ_BEGIN
    regex: 'FwEventManager:message to process: :>>[LT]'   # Rule 族走 :>>L、TXN 族走 :>>T
  - kind: SERVER_START
    prefix: '^DTPFsrv$'              # 行首必须是框架名（04 §3.2.1）
    regex: 'Command mailbox name:'   # 两个条件都命中，才打标签、才修正 SERVER_ID
  # 调用通道两对
  - kind: CALL_REQ
    regex: 'IntUtil::sendMessage:### xmlData for sending to (\S+)'
    capture: CALL_SYS
  - kind: CALL_RSP
    regex: 'IntUtil::sendMessage:### Received Message from (\S+)'
    capture: CALL_SYS
  - kind: CALL_REQ
    regex: 'FabApfUtilImpl::callRtdDispatchRule:RTD: Return Format is:'
    set: {CALL_SYS: RTD}             # 这对锚点里没有系统名可捕，写常量
  - kind: CALL_RSP
    regex: 'FabApfUtilImpl::callRtdDispatchRule:RTD: Success\.\.\.!No Error'
    set: {CALL_SYS: RTD}
  - kind: CALL_REQ
    regex: 'DTPFSSRSupport::dtpfExecuteServerSideRule:Input attributes before executing rule: _sendEdcSpaceData'
    set: {CALL_SYS: SPC}
  - kind: CALL_RSP
    regex: 'DTPFSSRSupport::dtpfExecuteServerSideRule:Output attributes before executing rule: _sendEdcSpaceData'
    set: {CALL_SYS: SPC}
  # 对象锁三条同形，一条模板覆盖 LOT / CARRIER / EQP（04 §3.2.3）
  - kind: LOCK_BEGIN
    regex: '\bLOCK (?P<OBJ>\w+) OBJECT START(?:\s+\w+:(?P<ID>\S+))?'
    capture: {OBJ: LOCK_OBJ, ID: LOCK_ID}
  - kind: LOCK_END
    regex: '\bLOCK (?P<OBJ>\w+) OBJECT END(?:\s+\w+:(?P<ID>\S+))?'
    capture: {OBJ: LOCK_OBJ, ID: LOCK_ID}
  # MES 业务错误行：只覆盖 Error(...)，Oracle 的 ORA- 行不打标签（04 §3.2.3）
  - kind: RULE_ERR_LINE
    regex: 'Error\(([^)]+)\)'
    capture: ERR_CODE
    match_all: true                  # 一行可多个 ⇒ 全部收进多值字段
  # 业务结果行：判据整串，等号之后的值原样落字段（04 §3.2.3）
  - kind: RULE_REPLY
    regex: 'FwSrvExecuteRuleTxn::store:rule reply =\s*(\S+)\s*$'
    capture: RULE_RESULT
  # 内部 Rule 调用起止（04 §3.2.3）：名字进 INNER_RULE_NAME、不进标签。
  #   注意前缀是小写 f 开头的 fwsrvExecServerRule，与大写 F 的 FwSrvExecuteRuleTxn 不是同一个方法名。
  #   与所属块 RULENAME 同名的是外层自身的执行行，派生层配对时整对放弃（04 §3.2.3 / 06 §2.2）
  - kind: INNER_RULE_START
    regex: 'fwsrvExecServerRule:start executing rule (\S+)'
    capture: INNER_RULE_NAME
  - kind: INNER_RULE_END
    regex: 'fwsrvExecServerRule:finish executing rule (\S+)'
    capture: INNER_RULE_NAME

# 第 2 段：派生层消费。耗时项由哪一对 MSG_KIND 界定
cost_items:
  - item: LOCK                       # 一条覆盖全部锁对象，不按对象分裂配置
    cn: 对象锁耗时
    begin: LOCK_BEGIN
    end:   LOCK_END
    group_by: LOCK_OBJ               # 按对象类型分组 ⇒ 一项变 N 项（LOT / CARRIER / EQP）
  - item: CALL                       # 一条覆盖全部子系统，不按系统分裂配置
    cn: 调用外部系统耗时
    begin: CALL_REQ
    end:   CALL_RSP
    group_by: CALL_SYS               # 按被调系统分组 ⇒ 一项变 N 项（SPL / R2R / RTD / SPC …）

# 第 3 段：派生层消费。块首行参数解析
biz_fields:
  - std: RULENAME
    source: header                   # 在请求头里，不在 attributes 内
    regex: 'ruleName="?([^"\s]+)"?'  # 自动 Rule 的 ruleName 带引号，要一并吃得下（04 §7.4 样例 C）
  - std: LOTID
    source: dynamic_key              # 没有固定键时的兜底：靠「以值锚定键」拿（04 §7.2 E 类）；**本期不启用**（只解析固定键）
    also: header_key                 # 自动 Rule 的 lotId= 写在请求头里
  - std: EQPID
    aliases: [EQPID, EQP, EQUIPMENTID, MACHINEID]
    also: header_key
  - std: CARRIERID
    aliases: [CARRIERID, CARRIER, CASSETTEID, CASSETTE, FOUPID, FOUP]
  - std: PORTID
    aliases: [PORTID, PORT, PORTNO]
    # 无固定键时由动态键条目的 value（`PORTID=…`）带出 ⇒ 本期不收入
  - std: USERID
    aliases: [USERID, USER]          # 三个形态写法不同：API2 的 USERID / XML 的 <userId> / 自动 Rule 的 USER
  - std: TID
    aliases: [TID, TRACEID, TRANSACTIONID, TRXID, TXID]

# 第 4 段：派生层调度参数（Scheduler / Worker 共用）
derive:
  fast_cycle_seconds: 30             # 快轮次周期，cron 对齐 0/30 * * * * *
  slow_cycle_seconds: 60             # 慢轮次周期，cron 对齐 0 * * * * *
  max_scan_span: 1h                  # 单轮最多推进的扫描区间
  cold_lookback: 1h                  # 冷启动回看宽度 W
  replay_watermark_seconds: 32       # 重放水位线 L，必须 ≥ 快轮次周期
  silence_minutes: 5                 # 静默期 N
  heartbeat_seconds: 10              # 心跳间隔 T
  dead_threshold_seconds: 30         # 判死阈值 = 3 × T
  pending_stale_seconds: 30          # 摘环判据：名下最早 Pending 超过这么久
  poll_interval_seconds: 1           # Worker 空闲轮询间隔
  retry_write_times: 3               # 写块文档的进程内重试次数
  retry_write_backoff: [1, 2, 4]     # 每次重试的等待秒数
  unit_rows: 20000                   # 1 单位行的行数上限：一次取行最多这么多、拉满即截
  replay_page_size: 1000             # 取这个单位行时每页拉多少行
  reclaim_after_seconds: 300         # 4b 触发①：Processing 超过这么久没进度就放回

# 第 5 段：节点健康。Worker 自报，Scheduler 只读
worker_health:
  fail_streak_limit: 3               # 本机累计失败这么多次自降 DEGRADED
  suicide_after_seconds: 900         # 降级持续这么久未恢复 → 退出进程

# 第 6 段：告警出口。Worker 内部重试到头、节点降级时用
alert:
  mail_to: ''                        # 留空则只记日志与指标，不发邮件
