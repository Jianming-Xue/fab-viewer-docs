# ==============================================================================
# fabviewer.yaml —— 加工层外置配置
#
# 消费方：
#   msg_kinds → 加工层（Logstash）。由 tools/render_msgkinds.py 渲染成
#               pipeline/30-msgkind.conf，**不直接读这个文件**
#
# 改规则的正确姿势：改本文件 → 重跑 tools/render_msgkinds.py → Logstash 自动重载
#   （logstash.yml 里 config.reload.automatic: true，检测周期 3s）
# 加工层加一条标签规则 = 本文件加一条 + 重跑渲染，**不改代码、不重启进程**
# ==============================================================================
version: 2026-11-19

# 加工层消费：行文本特征 → MSG_KIND
# 注意：不切块的流（COMM_RCV / COMM_SND / POLL）不加**任何切块用**的标签 ——
#       它们的 SERVER_CATEGORY 不参与块切分。
#       唯一例外是通信族的三个方向标记 COMM_R / COMM_S / COMM_P：它们只描述行首方向、
#       不参与切块
#
# 字段含义：
#   kind      标签名，写进行文档的 MSG_KIND
#   flag      可选。匹配**通信族行首的方向标记**（粗解析切出的 dir_flag，取值 ::R:: / ::S:: / ::P::），
#             相等比较。与 prefix / regex 是「与」的关系
#   prefix    可选。匹配**行首 token**（Logstash grok 出的 server_id），不是 LOG_BODY。
#             与 regex 是「与」的关系，两个都命中才算
#   regex     匹配 LOG_BODY
#   capture   取捕获组落字段：写字符串取第 1 个捕获组；写映射按命名捕获组对应。
#             字段是开放集合 ⇒ 新取值零配置
#   set       没有捕获组可取的锚点，直接写常量
#   match_all 一行可多个匹配，全部收进同一字段（多值）
msg_kinds:
  # 通信族方向标记。行首第三段是封闭枚举 ⇒ 直接做标签、
#   取值不进字段。匹配的是粗解析切出来的 dir_flag（判完即弃，不落文档）。
#   放最前 ⇒ 通信行的正文里即使含 Error(...)，也不会被 RULE_ERR_LINE 抢走。
  - kind: COMM_R
    flag: '::R::'
  - kind: COMM_S
    flag: '::S::'
  - kind: COMM_P
    flag: '::P::'
  - kind: REQ_BEGIN
    regex: 'FwEventManager:message to process: :>>[LT]'   # Rule 族走 :>>L、TXN 族走 :>>T
  - kind: SERVER_START
    prefix: '^DTPFsrv$'              # 行首必须是框架名
    regex: 'Command mailbox name:'   # 两个条件都命中，才打标签、才修正 SERVER_ID
  # 调用通道两对 + XML 的等待行 / 出错行（CALL_WAIT / CALL_ERR）
  - kind: CALL_REQ
    regex: 'IntUtil::sendMessage:### xmlData for sending to (\S+)'
    capture: CALL_SYS
  - kind: CALL_RSP
    regex: 'IntUtil::sendMessage:### Received Message from (\S+)'
    capture: CALL_SYS
  # XML 通道的等待行 / 出错行。有 req 无 rsp 是两类合法现象：wait=0 不等回复、
  #   出错走 ERROR 行。CALL_ERR 判据只取前缀 —— 错误形态会变（当前见到 Timeout(175-5)），不抓全；
  #   行上不带 CALL_SYS 的 CALL_ERR 同理，配对时继承行序上最近一条 CALL_REQ 的系统名；错误码顺手落 ERR_CODE（不参与判据）。
  #   等待秒数不落字段：等 / 不等用 CALL_NOWAIT（:0，行尾锚定，先判）/ CALL_WAIT（>0）两个标签表达。
  #   RTD / SPC 通道永远等待对方处理结束（无 NOWAIT），其错误 / 超时行形态待现场样料后补规则：同一 kind 加 regex 即可。
  - kind: CALL_NOWAIT
    regex: 'IntUtil::sendMessage:### Waiting time for (\S+):0$'
    capture: CALL_SYS
  - kind: CALL_WAIT
    regex: 'IntUtil::sendMessage:### Waiting time for (\S+):\d+'
    capture: CALL_SYS
  - kind: CALL_ERR
    regex: 'IntUtil::sendMessage:ERROR -'
    capture: ERR_CODE
    match_all: true
    scan_regex: 'Error\(([^)]+)\)'
  - kind: CALL_REQ
    regex: 'FabApfUtilImpl::callRtdDispatchRule:RTD: Return Format is:'
    set: {CALL_SYS: RTD}             # 这对锚点里没有系统名可捕，写常量
  - kind: CALL_RSP
    regex: 'FabApfUtilImpl::callRtdDispatchRule:RTD: Success\.\.\.!No Error'
    set: {CALL_SYS: RTD}
  - kind: CALL_REQ
    regex: 'DTPFSSRSupport::dtpfExecuteServerSideRule:Input attributes before executing rule: _sendEdcSpaceData'
    set: {CALL_SYS: SPC}
  - kind: CALL_RSP
    regex: 'DTPFSSRSupport::dtpfExecuteServerSideRule:Output attributes before executing rule: _sendEdcSpaceData'
    set: {CALL_SYS: SPC}
  # 对象锁三条同形，一条模板覆盖 LOT / CARRIER / EQP
  - kind: LOCK_BEGIN
    regex: '\bLOCK (?P<OBJ>\w+) OBJECT START(?:\s+\w+:(?P<ID>\S+))?'
    capture: {OBJ: LOCK_OBJ, ID: LOCK_ID}
  - kind: LOCK_END
    regex: '\bLOCK (?P<OBJ>\w+) OBJECT END(?:\s+\w+:(?P<ID>\S+))?'
    capture: {OBJ: LOCK_OBJ, ID: LOCK_ID}
  # MES 业务错误行：只覆盖 Error(...)，Oracle 的 ORA- 行不打标签
  - kind: RULE_ERR_LINE
    regex: 'Error\(([^)]+)\)'
    capture: ERR_CODE
    match_all: true                  # 一行可多个 ⇒ 全部收进多值字段
  # 业务结果行：判据只取执行器方法名的共同后缀，等号之后的值原样落字段
  - kind: RULE_REPLY
    regex: 'ExecuteRuleTxn::store:rule reply =\s*(\S+)\s*$'
    capture: RULE_RESULT
  # 内部 Rule 调用起止：名字进 INNER_RULE_NAME、不进标签。
  #   注意前缀是小写 f 开头的 fwsrvExecServerRule，与大写 F 的 FwSrvExecuteRuleTxn 不是同一个方法名。
  #   与所属块 RULENAME 同名的是外层自身的执行行，配对时整对放弃
  - kind: INNER_RULE_START
    regex: 'fwsrvExecServerRule:start executing rule (\S+)'
    capture: INNER_RULE_NAME
  - kind: INNER_RULE_END
    regex: 'fwsrvExecServerRule:finish executing rule (\S+)'
    capture: INNER_RULE_NAME
  # 发布小消息发送识别点：FwPublication::sendSmall 固定开头，间隔字节数，
  #   byte msg / reply is 为固定锚点，中间目标名与括号地址可变；只打标签，取值不落字段
  #   prefix 护栏：server_id 必须非空、且不以 COMM_ 开头（只挡 COMM，POLL 放开照打）。
  #   COMM_RCV / COMM_SND 若从文件名取 id 则是 COMM_xxxsrv.N。
  #   （COMM 行本就无 server_id、dir_flag 又被最前面三条抢走，这里再显式挡一层，不依赖隐性行为）
  - kind: PUB_SEND_SMALL
    prefix: '^(?!COMM_).+'
    regex: 'FwPublication::sendSmall:\d+ byte msg .*? reply is \S+'
