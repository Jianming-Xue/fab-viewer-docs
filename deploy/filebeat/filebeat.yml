# ==============================================================================
# MES 日志采集 · Filebeat 配置（采集层，每台业务机一份）
#
# 当前状态：只采 DEV 开发环境（ENV=DEV）；UAT 两组 input（ENV=UAT）已整组注释，放开时逐行去掉行首 #。
# 当前放开的 3 类日志文件，都在 /mes/dev/systemlogs/ 下：
#   *FABsrv.log*          业务族 FAB server，按大小滚 .log / .log.1 / .log.N
#   *COMM_RCVsrv*.log*    通信族接收，按时段滚，文件名带编号与时段
#   *COMM_SNDsrv*.log*    通信族发送，报文跨行，单独一组做多行合并
#   其余服务族 LIST / QUERY / OCAP / TRANS / XSITE / IDE / RTDLOG / POLL 已注释，按需放开。
#
# 环境标识与日志目录：DEV → /mes/dev/systemlogs/，UAT → /mes/uat/systemlogs/（ENV 值大写，目录名小写）；装之前核一下现场实际目录名。
# 日志目录：/mes/dev/systemlogs/（日志盘挂 /mes；挂到别处只改各组 paths 的前缀）
# 输出目标：logstash-01:5045 / logstash-02:5045（MES 管道 beats 口，与 10-input.conf 同值）
# 归档件：只采活动件；原地压缩或改名的由每组 exclude_files 挡掉
# ==============================================================================

###################### Filebeat 输入 ######################

filebeat.inputs:

  # ============ DEV · 不合并（FABsrv / COMM_RCV） ============
  - type: filestream
    id: mes-dev-plain
    enabled: true
    paths:
      # 业务族 FABsrv：按大小滚，* 同时覆盖 .log / .log.1 / .log.10；MBX 前缀可有可无
      - /mes/dev/systemlogs/*FABsrv.log*
      # 通信族 RCV：按时段滚，文件名带编号与时段（COMM_RCVsrv.1.0920.12-18.log.0），不做多行合并
      - /mes/dev/systemlogs/*COMM_RCVsrv*.log*
      # 以下服务族本期不采，放开时去掉行首 # 即可（Linux 文件名区分大小写）
      # - /mes/dev/systemlogs/*LISTsrv.log*
      # - /mes/dev/systemlogs/*QUERYsrv.log*
      # - /mes/dev/systemlogs/*OCAPsrv.log*
      # - /mes/dev/systemlogs/*TRANSsrv.log*
      # - /mes/dev/systemlogs/*XSITEsrv.log*
      # - /mes/dev/systemlogs/*IDEsrv.log*
      # - /mes/dev/systemlogs/*RTDLOGsrv.log*
      # - /mes/dev/systemlogs/*POLLsrv.log*
    prospector.scanner.exclude_files:        # 压缩件 + 原地改名的归档件不回采
      - '\.(gz|zip|bz2|xz|zst|tar|tgz)$'
      - '\.(bak|old|tmp)$'
    encoding: utf-8
    fields:
      ENV: DEV                              # 开发环境标识，落成事件顶层字段
      system.name: MES-300Works
    fields_under_root: true                 # 落成顶层字段；false 会变成 fields.ENV，加工层对不上
    ignore_older: 0                         # 首次启动从头读，现存全部滚动件一次补齐
    tail_files: false                       # 从文件头读，不跳历史
    # file_identity 走 9.x 默认 fingerprint（文件头 1KiB 的 SHA-256）—— 不依赖 inode、身份不复用；
    # include_file_fingerprint（9.5+ 默认 true）把指纹输出为事件字段 log.file.fingerprint
    prospector.scanner.check_interval: 5s
    prospector.scanner.recursive_glob: true
    buffer_size: 16KiB
    close.on_state_change.renamed: false    # 改名（滚动）不关 harvester，继续读完
    close.on_state_change.removed: true
    close.on_state_change.inactive: 5m
    clean_removed: true
    harvester_limit: 256                    # 部署前确认 ulimit -n ≥ 4096

  # ============ DEV · COMM_SND（报文跨行，按行首时间戳合并） ============
  - type: filestream
    id: mes-dev-comm-snd
    enabled: true
    paths:
      - /mes/dev/systemlogs/*COMM_SNDsrv*.log*
    prospector.scanner.exclude_files:        # 压缩件 + 原地改名的归档件不回采
      - '\.(gz|zip|bz2|xz|zst|tar|tgz)$'
      - '\.(bak|old|tmp)$'
    encoding: utf-8
    fields:
      ENV: DEV
      system.name: MES-300Works
    fields_under_root: true
    multiline:                              # 行首是 yyyy/MM/dd 时间戳就另起一条，否则并入上一行
      pattern: '^\d{4}/\d{2}/\d{2} '
      negate: true
      match: after
      max_lines: 500
      timeout: 5s
    ignore_older: 0
    tail_files: false
    # file_identity 走 9.x 默认 fingerprint（文件头 1KiB 的 SHA-256）—— 不依赖 inode、身份不复用；
    # include_file_fingerprint（9.5+ 默认 true）把指纹输出为事件字段 log.file.fingerprint
    prospector.scanner.check_interval: 5s
    prospector.scanner.recursive_glob: true
    buffer_size: 16KiB
    close.on_state_change.renamed: false
    close.on_state_change.removed: true
    close.on_state_change.inactive: 5m
    clean_removed: true
    harvester_limit: 256

  # ============ UAT · 暂不采（两组整组注释，放开时逐行去掉行首 #） ============
  # - type: filestream
  #   id: mes-uat-plain
  #   enabled: true
  #   paths:
  #     - /mes/uat/systemlogs/*FABsrv.log*
  #     - /mes/uat/systemlogs/*LISTsrv.log*
  #     - /mes/uat/systemlogs/*QUERYsrv.log*
  #     - /mes/uat/systemlogs/*OCAPsrv.log*
  #     - /mes/uat/systemlogs/*TRANSsrv.log*
  #     - /mes/uat/systemlogs/*XSITEsrv.log*
  #     - /mes/uat/systemlogs/*IDEsrv.log*
  #     - /mes/uat/systemlogs/*RTDLOGsrv.log*
  #     - /mes/uat/systemlogs/*POLLsrv.log*
  #     - /mes/uat/systemlogs/*COMM_RCVsrv*.log*
  #   prospector.scanner.exclude_files:
  #     - '\.(gz|zip|bz2|xz|zst|tar|tgz)$'
  #     - '\.(bak|old|tmp)$'
  #   encoding: utf-8
  #   fields:
  #     ENV: UAT
  #     system.name: MES-300Works
  #   fields_under_root: true
  #   ignore_older: 0
  #   tail_files: false
  #   prospector.scanner.check_interval: 5s
  #   prospector.scanner.recursive_glob: true
  #   buffer_size: 16KiB
  #   close.on_state_change.renamed: false
  #   close.on_state_change.removed: true
  #   close.on_state_change.inactive: 5m
  #   clean_removed: true
  #   harvester_limit: 256
  #
  # - type: filestream
  #   id: mes-uat-comm-snd
  #   enabled: true
  #   paths:
  #     - /mes/uat/systemlogs/*COMM_SNDsrv*.log*
  #   prospector.scanner.exclude_files:
  #     - '\.(gz|zip|bz2|xz|zst|tar|tgz)$'
  #     - '\.(bak|old|tmp)$'
  #   encoding: utf-8
  #   fields:
  #     ENV: UAT
  #     system.name: MES-300Works
  #   fields_under_root: true
  #   multiline:
  #     pattern: '^\d{4}/\d{2}/\d{2} '
  #     negate: true
  #     match: after
  #     max_lines: 500
  #     timeout: 5s
  #   ignore_older: 0
  #   tail_files: false
