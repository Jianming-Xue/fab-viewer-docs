    fields:
      ENV: UAT
      system.name: MES-300Works
    fields_under_root: true
    ignore_older: 0
    tail_files: false
    prospector.scanner.check_interval: 5s
    prospector.scanner.recursive_glob: true
    buffer_size: 16384
    close.on_state_change.renamed: false
    close.on_state_change.removed: true
    close.on_state_change.inactive: 5m
    clean_removed: true
    harvester_limit: 256

  # ============ UAT · COMM_SND（报文跨行，按行首时间戳合并） ============
  - type: filestream
    id: mes-uat-comm-snd
    enabled: true
    paths:
      - /home/ad300w/systemlog/*COMM_SNDsrv*.log*
    prospector.scanner.exclude_files:
      - '\.(gz|zip|bz2|xz|zst|tar|tgz)$'
      - '\.(bak|old|tmp)$'
    encoding: utf-8
    fields:
      ENV: UAT
      system.name: MES-300Works
    fields_under_root: true
    parsers:
      - multiline:
          type: pattern
          pattern: '^\d{4}/\d{2}/\d{2} '
          negate: true
          match: after
          max_lines: 500
          timeout: 5s
    ignore_older: 0
    tail_files: false
    prospector.scanner.check_interval: 5s
    prospector.scanner.recursive_glob: true
    buffer_size: 16384
    close.on_state_change.renamed: false
    close.on_state_change.removed: true
    close.on_state_change.inactive: 5m
    clean_removed: true
    harvester_limit: 256

###################### 主机元数据 ######################

# 提供 host.ip（全部网卡，多值）与 host.name；HOSTIP 由加工层按 CIDR 从数组里挑一个
processors:
  - add_host_metadata:
      netinfo.enabled: true        # 必须 true；false 则不产生 host.ip，HOSTIP 缺一段、锁流三元组失效
      cache.ttl: 5m
  # log.file.fingerprint 兜底：filestream 的 include_file_fingerprint 在 9.5.6 实测
  # 不往事件输出该字段（默认与各种显式配置组合均不生效），而 logstash 加工层
  # 40-derive-fields 的行身份键 line_id 依赖它；这里用 fingerprint 处理器对文件身份
  # 三元组（path+inode+device_id）做 SHA-256 —— 同一文件身份稳定、重采不变形
  - fingerprint:
      fields: ["log.file.path", "log.file.inode", "log.file.device_id"]
      target_field: "log.file.fingerprint"

###################### 内存队列 ######################

# 输出抖动时不丢事件，又不无界占内存
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 1s

###################### 输出 ######################

output.logstash:
  # 端口 = Logstash MES 管道（mes-lines）的专用 beats 口，与 10-input.conf 一致
  hosts: ["logstash-01:5045", "logstash-02:5045"]
  loadbalance: true
  worker: 2
  bulk_max_size: 2048
  compression_level: 3
  ttl: 60s                  # 加工层实例增减后一分钟内重新分配
  backoff.init: 1s
  backoff.max: 60s
  slow_start: true

###################### 进度与日志 ######################

# registry 是采集进度的唯一凭据；flush 1s 把重启后的重读窗口压到最小
# 重投递不会产生重复行：行文档按行 ID 去重
filebeat.registry.path: /var/lib/filebeat/registry
filebeat.registry.flush: 1s
filebeat.shutdown_timeout: 10s

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: "0644"

monitoring.enabled: false
