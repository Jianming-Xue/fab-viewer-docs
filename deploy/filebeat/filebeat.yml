# ==============================================================================
# MES 日志采集 · Filebeat 配置（采集层，每台业务机一份）
#
# 当前状态：只采 UAT 测试环境（ENV=UAT）；DEV 两组 input（ENV=DEV）已整组注释，放开时逐行去掉行首 #。
# 日志目录：/home/ad300w/systemlog/（DEV / UAT 共用同一目录，挂到别处只改各组 paths 的目录前缀）
# 当前 UAT 放开的日志：
#   UAT_MBX.FABsrv_log*    业务族 FAB server；UAT_MBX 是当前 Mailbox 名，末尾 * 覆盖该族全部滚动件
#   当前启用 5 个业务族：FAB / QUERY / LIST / OCAP / XSITE；其余候选族在组内注释，按需放开
#   *COMM_RCVsrv*.log*     通信族接收，按时段滚，文件名带编号与时段，不做多行合并
#   *COMM_SNDsrv*.log*     通信族发送，报文跨行，单独一组做多行合并
#   DEV 两组整组注释，组内业务族清单与 UAT 同构，放开时逐行去掉行首 #。
#
# 业务族文件名 = <Mailbox 名>.<服务族>srv_log*（Mailbox 名与服务族之间是点，不是下划线）；通信族文件名 = *COMM_*srv*.log*，两套规则不同。
# Mailbox 名：UAT → UAT_MBX，DEV → DEV_MBX；在文件名里、不在目录里，换 Mailbox 时改各组 paths 里每条业务族的文件名前缀。
# 环境标识：ENV 值大写（DEV / UAT），只是事件字段；同目录同时启用两套时业务族靠文件名前缀区分，COMM 两族文件名不带环境段。
# 输出目标：logstash-01:5045 / logstash-02:5045（MES 管道 beats 口，与 10-input.conf 同值）
# 归档件：只采活动件；原地压缩或改名的由每组 exclude_files 挡掉
# ==============================================================================

