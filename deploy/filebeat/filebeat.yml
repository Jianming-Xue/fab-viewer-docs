    #  - /home/ad300w/systemlog/UAT_MBX.PARTsrv_log*
    #  - /home/ad300w/systemlog/UAT_MBX.RTDLOGsrv_log*
    #  - /home/ad300w/systemlog/UAT_MBX.RTLsrv_log*
    #  - /home/ad300w/systemlog/UAT_MBX.SCANsrv_log*
    #  - /home/ad300w/systemlog/UAT_MBX.TRANSsrv_log*
      - /home/ad300w/systemlog/UAT_MBX.XSITEsrv_log*
