###################### 主机元数据 ######################

# 提供 host.ip（全部网卡，多值）与 host.name；HOSTIP 由加工层按 CIDR 从数组里挑一个
processors:
  - add_host_metadata:
      netinfo.enabled: true        # 必须 true；false 则不产生 host.ip，HOSTIP 缺一段、锁流三元组失效
      cache.ttl: 5m

###################### 内存队列 ######################

# 输出抖动时不丢事件，又不无界占内存
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 1s

###################### 输出 ######################

output.logstash:
  # 端口 = Logstash MES 管道（mes-lines）的专用 beats 口，与 10-input.conf 一致
  hosts: ["logstash-01:5045", "logstash-02:5045"]
  loadbalance: true
  worker: 2
  bulk_max_size: 2048
  compression_level: 3
  ttl: 60s                  # 加工层实例增减后一分钟内重新分配
  backoff.init: 1s
  backoff.max: 60s
  slow_start: true

###################### 进度与日志 ######################

# registry 是采集进度的唯一凭据；flush 1s 把重启后的重读窗口压到最小
# 重投递不会产生重复行：行文档按行 ID 去重
filebeat.registry.path: /var/lib/filebeat/registry
filebeat.registry.flush: 1s
filebeat.shutdown_timeout: 10s

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: "0644"

monitoring.enabled: false
